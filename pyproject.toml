[project]
name = "multi-provider-llm-gateway"
version = "0.1.0"
description = "Async multi-provider LLM gateway with real-time token and cost telemetry"
readme = "README.md"
authors = [
    { name = "patie03", email = "patiekalanga@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.125.0",
    "fastapi>=0.128.8",
    "openai>=2.48.0",
    "pydantic>=2.13.5",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.50.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.39.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls the real OpenAI/Anthropic APIs (costs a fraction of a cent)"]
